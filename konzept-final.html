<script>
var svg=document.getElementById("pick"),read=document.getElementById("read"),
 defs=document.getElementById("defs"),art=document.getElementById("art"),handles=document.getElementById("handles"),
 cout=document.getElementById("cout"),pout=document.getElementById("pout");
function C(a){return a.map(function(p){return{ax:p[0],ay:p[1],fx:p[2],fy:p[3]};});}
function P(a){return a.map(function(p){return{x:p[0],y:p[1]};});}
/* Mirrors what is ACTUALLY on the live page right now (synced 2026-07-30, when
   saving was wired up). This has to stay truthful: the save button rewrites the
   whole KZ:final block from these arrays, so if INIT drifted from the real page
   the first save would silently wipe the real layout and replace it with the
   editor's placeholders. Camera entries are pos_x pos_y aim_x aim_y — the live
   page stores an angle instead, and the aim points below are that angle read
   back off each cone's own far edge. gates is EMPTY on purpose since 2026-07-30:
   Baseconcept.svg draws a barrier at the entrance itself, so one placed here too
   read as two. Add one from the button if a second barrier is ever wanted. */
var INIT={
 cams:[[360,432,493,570],[560,410,560,562],[800,478,724,601],[320,612,455,615],[920,600,790,610]],
 alarms:[],
 firealarms:[[405,505],[690,510]],
 sensors:[[150,548],[258,778],[950,566],[882,762]],
 gates:[],
 cps:[[447,742],[470,425],[820,610],[600,790]],
 guards:[[705,902],[560,628],[352,706]]
};
var cams,alarms,firealarms,sensors,gates,cps,guards;
function load(){cams=C(INIT.cams);alarms=P(INIT.alarms);firealarms=P(INIT.firealarms);sensors=P(INIT.sensors);gates=P(INIT.gates);cps=P(INIT.cps);guards=P(INIT.guards);}
load();
/* INIT above is only the OFFLINE FALLBACK now. The live coordinates are pulled
   from the page itself on load (GET /state/final), because a hardcoded INIT is a
   data-loss trap: edit -> save -> reload the editor -> it resets to the stale
   literal -> the next save silently overwrites your real layout with it. That
   already happened once (2026-07-30). If the fetch fails (server down, or you
   opened this via file://) we keep INIT and say so, rather than pretending. */
fetch("/state/final")
  .then(function (r) { return r.ok ? r.json() : Promise.reject(); })
  .then(function (d) {
    if (!d || !d.ok) return Promise.reject();
    INIT = {
      cams: d.cams, alarms: d.alarms, firealarms: d.firealarms,
      sensors: d.sensors, gates: d.gates, cps: d.cps, guards: d.guards,
    };
    load();
    render();
    var st = document.getElementById("status");
    st.textContent = "\u2713 Cargado desde la web (" + d.cams.length + " cam, " +
      d.sensors.length + " sens, " + d.cps.length + " cp, " + d.guards.length + " guardias)";
  })
  .catch(function () {
    var st = document.getElementById("status");
    st.textContent = "\u26A0 No pude leer el estado actual \u2014 mostrando valores por defecto. " +
      "NO guardes sin revisar, o pisarías el layout real.";
  });
var drag=null;
function toSvg(e){var p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse());}

function el(t,a){var e=document.createElementNS("http://www.w3.org/2000/svg",t);for(var k in a)e.setAttribute(k,a[k]);return e;}

 g.appendChild(el("circle",{cx:x,cy:y,r:4,fill:color}));return g;}
/* 0.34, not 0.32 (fixed 2026-07-30 when saving was wired up): konzept-server.js's
   own cone() writes the saved path at 0.34, so a 0.32 preview here meant the
   editor showed a slightly narrower beam than what actually landed on the site. */
function cone(ax,ay,fx,fy){var dx=fx-ax,dy=fy-ay,L=Math.hypot(dx,dy)||1,ux=dx/L,uy=dy/L,px=-uy,py=ux,hw=L*0.34;

var BLUE="#3D9AD3";
/* The client's camera artwork is a fixed isometric drawing, so it can't be rotated
   toward its aim point. Aim = variant + mirror instead: "de frente" faces the
   viewer (aim below the mount), "de atras" faces away. KEEP IN SYNC with
   camMarkup() in konzept-server.js — that is what actually gets written to the
   page, and a mismatch here means the editor lies about the result. */

  art.appendChild(el("path",{d:cone(c.ax,c.ay,c.fx,c.fy),fill:"url(#cg"+i+")"}));

  handles.appendChild(hnd(c.ax,c.ay,"ca",i,"#cfe8fb"));
  handles.appendChild(hnd(c.fx,c.fy,"cf",i,BLUE));
 });

  g.appendChild(el("rect",{x:-13,y:-15,width:26,height:30,rx:4,fill:"#010101",stroke:BLUE,"stroke-width":2.4}));
  g.appendChild(el("circle",{cx:0,cy:0,r:4,fill:BLUE}));
  g.appendChild(el("path",{d:"M18 -14 A26 26 0 0 1 18 14",fill:"none",stroke:BLUE,"stroke-width":2,opacity:.7}));
  g.appendChild(el("path",{d:"M-18 -14 A26 26 0 0 0 -18 14",fill:"none",stroke:BLUE,"stroke-width":2,opacity:.7}));
  art.appendChild(g);handles.appendChild(hnd(a.x,a.y,"al",i,BLUE));});
 // Fire alarm = the client's own #konzept-firealarm art, white like on the site.

/* ---- Deleting -------------------------------------------------------------
   Double-click alone was the only way to remove something, and it is unreliable
   here: the first click of the pair starts a drag, so the element usually shifts
   before it disappears. Three paths now, all going through one map so they can't
   drift apart:
     - "Borrar" mode: a single pointerdown on a handle removes it (no drag).
     - Double-click: kept as the shortcut it always was.
     - Delete / Backspace: removes whatever handle the pointer is over.
   For a camera, ca (position) and cf (aim) both index the SAME cams entry, so
   hitting either removes that whole camera — which is what you want, since an
   aim point with no camera is meaningless. */
function arrays(){return {ca:cams,cf:cams,al:alarms,fa:firealarms,se:sensors,ga:gates,cp:cps,gu:guards};}
function removeHandle(h){
 if(!h) return false;
 var t=h.getAttribute("data-t"), i=+h.getAttribute("data-i"), a=arrays()[t];
 if(!a) return false;
 a.splice(i,1); drag=null; render(); return true;
}
var delMode=false, hoverHandle=null;
var delBtn=document.getElementById("del"), stage=document.querySelector(".stage");
function setDel(on){
 delMode=on;
 delBtn.classList.toggle("on",on);
 delBtn.setAttribute("aria-pressed",String(on));
 stage.classList.toggle("deleting",on);
}
delBtn.setAttribute("aria-pressed","false");
delBtn.onclick=function(){setDel(!delMode);};
svg.addEventListener("dblclick",function(e){removeHandle(e.target.closest(".handle"));});
svg.addEventListener("pointerover",function(e){hoverHandle=e.target.closest(".handle");});
svg.addEventListener("pointerout",function(e){if(e.target.closest(".handle")===hoverHandle) hoverHandle=null;});
addEventListener("keydown",function(e){
 if(e.key!=="Delete"&&e.key!=="Backspace") return;
 if(/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)) return;
 if(removeHandle(hoverHandle)){e.preventDefault(); hoverHandle=null;}
});
