<style>
 html,body{margin:0;background:#3B4956;color:#fff;font-family:system-ui,Arial;height:100%}
 .wrap{display:flex;gap:16px;padding:16px;box-sizing:border-box;height:100%}
 .stage{flex:1;min-width:0;display:flex;align-items:center;justify-content:center}

 .read{font:600 17px/1.3 monospace;background:#0003;padding:8px 10px;border-radius:8px}

 #wout{height:90px}#lout{height:90px}
 .row{display:flex;gap:8px}
 .row button{flex:1;padding:9px;border:0;border-radius:8px;background:#3D9AD3;color:#fff;font-weight:600;cursor:pointer}
 .row button.alt{background:#54636f}.row button.warn{background:#ff5b52}
 .hint{font-size:11px;opacity:.7;line-height:1.4}

 <div class="panel">
  <h3>EDITOR — CAPA 2 (RIESGOS)</h3>
  <div class="read" id="read">x: —  y: —</div>
  <div class="hint">Arrastrá los ítems. Advertencia = 1 punto (el del piso). Luz = 2 puntos (origen + destino). Doble-clic en un punto = borrar. G = grilla.</div>
  <div class="row"><button id="addW" class="warn">+ Advertencia</button><button id="addL" class="alt">+ Luz roja</button></div>
  <button id="save" style="padding:12px;border:0;border-radius:8px;background:#2ec16b;color:#04220f;font-weight:800;cursor:pointer;font-size:15px">💾 Guardar en la web</button>
  <div id="status" style="font-size:12px;min-height:16px;opacity:.85"></div>
  <label class="h">ADVERTENCIAS (x y):</label>
  <textarea id="wout" readonly></textarea>
  <label class="h">LUCES (origen_x origen_y  destino_x destino_y):</label>
  <textarea id="lout" readonly></textarea>

  <div class="row"><button id="reset" class="alt">Reset</button></div>
 </div>

<script>
var svg=document.getElementById("pick"),read=document.getElementById("read"),
 defs=document.getElementById("defs"),art=document.getElementById("art"),handles=document.getElementById("handles"),
 wout=document.getElementById("wout"),lout=document.getElementById("lout");
var WI=[[320,600],[770,555],[560,770]], LI=[[620,470,624,690],[305,545,306,715]];
var warns=WI.map(function(p){return{x:p[0],y:p[1]};});
var lights=LI.map(function(p){return{ax:p[0],ay:p[1],fx:p[2],fy:p[3]};});
var drag=null;
function toSvg(e){var p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse());}
function r(n){return Math.round(n);}
function el(t,a){var e=document.createElementNS("http://www.w3.org/2000/svg",t);for(var k in a)e.setAttribute(k,a[k]);return e;}
function cone(ax,ay,fx,fy){var dx=fx-ax,dy=fy-ay,L=Math.hypot(dx,dy)||1,ux=dx/L,uy=dy/L,px=-uy,py=ux,hw=L*0.34;
 return "M"+r(ax)+" "+r(ay)+" L"+r(fx+px*hw)+" "+r(fy+py*hw)+" L"+r(fx-px*hw)+" "+r(fy-py*hw)+" Z";}
function render(){
 art.innerHTML="";handles.innerHTML="";
 defs.querySelectorAll(".lg").forEach(function(n){n.remove();});
 lights.forEach(function(l,i){
  var g=el("linearGradient",{id:"e-light-"+i,"class":"lg",gradientUnits:"userSpaceOnUse",x1:l.ax,y1:l.ay,x2:l.fx,y2:l.fy});
  g.appendChild(el("stop",{offset:"0%","stop-color":"#ff5b52","stop-opacity":"0.5"}));
  g.appendChild(el("stop",{offset:"100%","stop-color":"#ff5b52","stop-opacity":"0"}));
  defs.appendChild(g);
  art.appendChild(el("path",{d:cone(l.ax,l.ay,l.fx,l.fy),fill:"url(#e-light-"+i+")"}));
  handles.appendChild(hnd(l.ax,l.ay,"la",i,"#ffb0ac"));
  handles.appendChild(hnd(l.fx,l.fy,"lf",i,"#ff5b52"));
 });
 warns.forEach(function(w,i){
  var g=el("g",{transform:"translate("+w.x+" "+w.y+")"});
  g.appendChild(el("ellipse",{rx:84,ry:44,fill:"url(#e-glow)"}));
  [0,1,2].forEach(function(ri){var e=el("ellipse",{rx:60,ry:30,fill:"none",stroke:"#ff5b52","stroke-width":2,"class":"rip"});e.style.animationDelay=ri+"s";g.appendChild(e);});
  g.appendChild(el("circle",{r:13,fill:"#ff5b52"}));
  g.appendChild(el("line",{x1:0,y1:0,x2:0,y2:-78,stroke:"#ff5b52","stroke-width":2,opacity:.55}));
  var ic=el("g",{transform:"translate(0 -104)"});
  ic.appendChild(el("path",{d:"M0 -22 L22 17 L-22 17 Z",fill:"none",stroke:"#ff5b52","stroke-width":3,"stroke-linejoin":"round"}));
  ic.appendChild(el("rect",{x:-2.4,y:-8,width:4.8,height:14,fill:"#ff5b52"}));
  ic.appendChild(el("rect",{x:-2.4,y:10,width:4.8,height:4.8,fill:"#ff5b52"}));
  g.appendChild(ic);art.appendChild(g);
  handles.appendChild(hnd(w.x,w.y,"w",i,"#fff"));
 });
 wout.value=warns.map(function(w,i){return "W"+(i+1)+": "+r(w.x)+" "+r(w.y);}).join("\n");
 lout.value=lights.map(function(l,i){return "L"+(i+1)+": "+r(l.ax)+" "+r(l.ay)+"  "+r(l.fx)+" "+r(l.fy);}).join("\n");
}
function hnd(x,y,type,i,color){var g=el("g",{"class":"handle","data-t":type,"data-i":i});
 g.appendChild(el("circle",{cx:x,cy:y,r:13,fill:color,"fill-opacity":.3,stroke:color,"stroke-width":2}));
 g.appendChild(el("circle",{cx:x,cy:y,r:5,fill:color}));return g;}
svg.addEventListener("pointerdown",function(e){var h=e.target.closest(".handle");if(!h)return;
 drag={t:h.getAttribute("data-t"),i:+h.getAttribute("data-i")};svg.setPointerCapture(e.pointerId);});
svg.addEventListener("pointermove",function(e){var q=toSvg(e);read.textContent="x: "+r(q.x)+"   y: "+r(q.y);if(!drag)return;
 if(drag.t==="w")warns[drag.i]={x:q.x,y:q.y};
 else if(drag.t==="la"){lights[drag.i].ax=q.x;lights[drag.i].ay=q.y;}
 else if(drag.t==="lf"){lights[drag.i].fx=q.x;lights[drag.i].fy=q.y;}
 render();});
svg.addEventListener("pointerup",function(){drag=null;});
svg.addEventListener("dblclick",function(e){var h=e.target.closest(".handle");if(!h)return;var t=h.getAttribute("data-t"),i=+h.getAttribute("data-i");
 if(t==="w")warns.splice(i,1);else lights.splice(i,1);render();});
document.getElementById("addW").onclick=function(){warns.push({x:540,y:600});render();};
document.getElementById("addL").onclick=function(){lights.push({ax:540,ay:500,fx:540,fy:720});render();};
document.getElementById("copyW").onclick=function(){wout.select();document.execCommand("copy");};
document.getElementById("copyL").onclick=function(){lout.select();document.execCommand("copy");};
document.getElementById("reset").onclick=function(){warns=WI.map(function(p){return{x:p[0],y:p[1]};});lights=LI.map(function(p){return{ax:p[0],ay:p[1],fx:p[2],fy:p[3]};});render();};
document.getElementById("save").onclick=function(){var st=document.getElementById("status");st.textContent="Guardando…";
 fetch("/save/risk",{method:"POST",headers:{"Content-Type":"application/json"},
  body:JSON.stringify({warnings:warns.map(function(w){return [Math.round(w.x),Math.round(w.y)];}),
   lights:lights.map(function(l){return [Math.round(l.ax),Math.round(l.ay),Math.round(l.fx),Math.round(l.fy)];})})})
  .then(function(r){return r.json();})
  .then(function(d){st.textContent=d.ok?("✓ Guardado + "+d.build+" — refrescá la web"):("✗ "+d.error);})
  .catch(function(e){st.textContent="✗ ¿Está corriendo el servidor? Abrí este editor vía http://localhost:8787/konzept-risk.html";});};
addEventListener("keydown",function(e){if(e.key.toLowerCase()==="g")document.getElementById("grid").style.display=document.getElementById("grid").style.display==="none"?"":"none";});
render();
</script></body></html>
