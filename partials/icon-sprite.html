<!--
  Shared icon sprite. Hidden SVG <symbol> defs, referenced elsewhere via
  <svg class="icon"><use href="#icon-name"></use></svg> — zero extra HTTP
  requests, themeable via currentColor, no icon-font/library dependency.
  Include this once, as early in <body> as possible (before first use).
-->
<svg xmlns="http://www.w3.org/2000/svg" class="visually-hidden" aria-hidden="true">
  <defs>
    <g id="icon-defs" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <symbol id="icon-shield-check" viewBox="0 0 24 24">
        <path d="M12 3l7 3v5c0 4.5-3 8.5-7 10-4-1.5-7-5.5-7-10V6l7-3z"/>
        <path d="M9 12l2 2 4-4"/>
      </symbol>
      <symbol id="icon-contact" viewBox="0 0 24 24">
        <circle cx="12" cy="8" r="3.5"/>
        <path d="M5 20c0-3.5 3-6 7-6s7 2.5 7 6"/>
      </symbol>
      <symbol id="icon-transparency" viewBox="0 0 24 24">
        <path d="M2 12s4-6 10-6 10 6 10 6-4 6-10 6-10-6-10-6z"/>
        <circle cx="12" cy="12" r="3"/>
      </symbol>
      <symbol id="icon-clock" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9"/>
        <path d="M12 7v5l3.5 2"/>
      </symbol>
      <!-- A PLAIN cloud, deliberately not a cloud-with-up-arrow: /ueber-uns/ uses it
           for "Cloud-basierte Objektdokumentation", where the documentation LIVES in
           the cloud — an arrow would say "upload", which is a different claim.
           Sized to span y ≈ 5→18 rather than hugging the middle of the box: drawn
           smaller it rendered visibly lighter than its siblings in the same row
           (#icon-calendar spans 3→21). Rendered at 24 / 40 / 56px against those
           siblings before picking this one, not judged from the path. -->
      <symbol id="icon-cloud" viewBox="0 0 24 24">
        <path d="M4.5 18h14a4 4 0 0 0 0-8 6 6 0 0 0-10.9-2.1A5.3 5.3 0 0 0 4.5 18z"/>
      </symbol>
      <symbol id="icon-badge" viewBox="0 0 24 24">
        <circle cx="12" cy="9" r="6"/>
        <path d="M9 14.5L7.5 21 12 18.5 16.5 21 15 14.5"/>
      </symbol>
      <symbol id="icon-calendar" viewBox="0 0 24 24">
        <rect x="3" y="5" width="18" height="16" rx="2"/>
        <path d="M3 10h18M8 3v4M16 3v4"/>
        <path d="M8.5 15l2 2 4-4"/>
      </symbol>
      <symbol id="icon-check" viewBox="0 0 24 24">
        <path d="M4 12l5 5L20 6"/>
      </symbol>
      <symbol id="icon-alert" viewBox="0 0 24 24">
        <path d="M12 3L2 20h20L12 3z"/>
        <path d="M12 9v5M12 17h.01"/>
      </symbol>
      <symbol id="icon-phone" viewBox="0 0 24 24">
        <path d="M4 4h4l2 5-2.5 1.5a11 11 0 005 5L14 13l5 2v4a2 2 0 01-2 2C9.5 21 3 14.5 3 6a2 2 0 012-2z"/>
      </symbol>
      <symbol id="icon-star" viewBox="0 0 24 24" fill="currentColor" stroke="none">
        <path d="M12 2l2.9 6.9L22 9.6l-5.5 4.8L18 21l-6-3.6L6 21l1.5-6.6L2 9.6l7.1-.7L12 2z"/>
      </symbol>
      <symbol id="icon-pin" viewBox="0 0 24 24">
        <path d="M12 21s7-6.5 7-12a7 7 0 00-14 0c0 5.5 7 12 7 12z"/>
        <circle cx="12" cy="9" r="2.5"/>
      </symbol>
      <!-- Points left by default; .outfits__arrow--next mirrors it with
           CSS transform:scaleX(-1) rather than adding a second symbol. -->
      <symbol id="icon-chevron" viewBox="0 0 24 24">
        <path d="M15 5l-7 7 7 7"/>
      </symbol>
      <!-- Added 2026-08-14 for the mobile/tablet menu's own close control
           (.nav-close). Inset to 6..18 rather than drawn corner to corner: at
           the 24px box the header's hamburger uses, a full-bleed X reads
           heavier than the three bars it replaces. -->
      <symbol id="icon-close" viewBox="0 0 24 24">
        <path d="M6 6l12 12M18 6L6 18"/>
      </symbol>
      <!-- Drawn pointing up-right (↗) at rest. .services__item-arrow
           (page-home.css) rotates this 45deg clockwise on hover, turning
           it into a straight right arrow (→) — one icon, two states via
           CSS transform, not two separate symbols, so the transition
           between them is an actual smooth rotation rather than a swap
           or crossfade. -->
      <symbol id="icon-arrow-diagonal" viewBox="0 0 24 24">
        <path d="M7 17L17 7M17 7H9M17 7V15"/>
      </symbol>
      <!-- Added 2026-08-03 for the Werkschutz/Objektschutz comparison, one line
           icon per service. Same 24x24 grid, same 1.5 stroke from #icon-defs as
           every other symbol here — no fill, no second weight. -->
      <!-- Production site: saw-tooth hall + chimney, i.e. a plant in operation.
           REDRAWN 2026-08-10 (client: "el icono este puede y debe mejorar"), and
           the three faults are worth naming because they are what a factory glyph
           gets wrong:
           · the CHIMNEY was `M18 5V3h2v2` — an open bracket floating clear of the
             building, which at any real size reads as a flag or an antenna, not a
             stack. It is now a full stack standing on the ground with a cap lip,
             so its silhouette is unambiguous;
           · the hall and the stack were ONE path, so the roof ran straight into a
             tall block and the whole thing read as a jagged chart line. They are
             separate objects now, sitting on a shared ground line;
           · the teeth were 3 units deep against an 18-unit-wide drawing, so the
             saw-tooth — the thing that says "factory" — was the smallest feature
             in it. They are 3.2 deep on a 12-wide hall now.
           The shape is hall → machine house → chimney, in that order left to right,
           which is the silhouette that reads as "factory" without a caption. Two
           rejected drafts, because the reason matters more than the coordinates:
           a hall plus a bare tall block reads as a warehouse with a tower, and a
           hall plus a narrow capped stack reads as a pipe or a thermometer. The
           chimney has to sit ON something for the block to become a building.

           ⚠️ SIZED FOR ITS SMALLEST USE, NOT ITS LARGEST. This symbol renders at
           18px on /werkschutz/, 28px on /leistungen/ and 44px on
           /brandwache-nuernberg/ — all three measured. The chimney is 3.1 units
           wide because at 2.4 its two verticals merge into one blob at 18px; the
           four candidates were rendered at all three sizes before picking this one.

           Ink is x 2.5→21.5, y 3.9→20.5. Same 24x24 grid and the 1.5 stroke
           inherited from #icon-defs. -->
      <symbol id="icon-factory" viewBox="0 0 24 24">
        <path d="M2.5 20.5h19"/>
        <path d="M3.5 20.5V12.2l3.5 2.8V12.2l3.5 2.8V12.2l3.5 2.8"/>
        <path d="M14 20.5V8h5.4v12.5"/>
        <path d="M15.3 8V3.9h3.1V8"/>
      </symbol>
      <!-- Added 2026-08-03 for /jobs/: "Bezahlung, die ankommt" (the employer
           benefits four-up and the hero badge). A euro coin, drawn on the same
           24x24 grid with the 1.5 stroke from #icon-defs — no fill, so it sits
           in a row with #icon-calendar / #icon-clock / #icon-building without
           looking like a different icon set. -->
      <symbol id="icon-euro" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9"/>
        <path d="M15.5 8.8a4.2 4.2 0 100 6.4"/>
        <path d="M7.8 11h5.2M7.8 13.5h5.2"/>
      </symbol>
      <!-- Added 2026-08-03: the Ansprechpartner block's mail action. #icon-contact
           (a person silhouette) was standing in for it, which is the wrong glyph
           for an email address. Same 24x24 grid and 1.5 stroke as the rest. -->
      <symbol id="icon-mail" viewBox="0 0 24 24">
        <rect x="3" y="5.5" width="18" height="13" rx="2"/>
        <path d="M3.5 6.5l8.5 6 8.5-6"/>
      </symbol>
      <!-- Documentation that has been signed off: a page with a folded corner and
           a check inside it. Added 2026-08-10 for /sicherheitsdienst-nuernberg/'s
           Erreichbarkeit tile ("Dokumentation für Behörde und Versicherung
           inklusive"), which had no glyph in this sprite — #icon-shield-check was
           the nearest and a shield reads as protection, not paperwork. Same
           24x24 grid and 1.5 stroke as the rest; arcs kept out of it deliberately
           so it stays crisp at small sizes.
           ⚠️ A SECOND CONSUMER since 2026-08-10: /brandwache-nuernberg/'s
           "Behördenfest dokumentiert" Warum card, replacing #icon-badge there
           (a medal read as an award, not as paperwork surviving an audit — the
           exact same claim this symbol was already drawn for). It renders at 44px
           there against the ~22px this comment used to name, and reads clean at
           both — the arcs-free construction is what makes that hold. -->
      <symbol id="icon-document-check" viewBox="0 0 24 24">
        <path d="M13.5 3H6.5A1.5 1.5 0 005 4.5v15A1.5 1.5 0 006.5 21h11a1.5 1.5 0 001.5-1.5V8.5L13.5 3z"/>
        <path d="M13.5 3v5.5H19"/>
        <path d="M8.5 14.5l2.5 2.5 4.5-4.5"/>
      </symbol>
      <!-- Download: a tray with an arrow landing in it. Deliberately NOT the
           document-with-arrow variant — #icon-document-check is already a sheet
           and the two sit within a few hundred pixels of each other on
           /sicherheitskonzept/, where two sheet glyphs would read as repetition
           rather than as two different actions. The tray says "save this", which
           is the action; what is being saved is named by the label beside it. -->
      <symbol id="icon-download" viewBox="0 0 24 24">
        <path d="M12 3v12"/>
        <path d="M7.5 10.5L12 15l4.5-4.5"/>
        <path d="M4 16.5v2A2.5 2.5 0 006.5 21h11a2.5 2.5 0 002.5-2.5v-2"/>
      </symbol>
      <!-- Premises: a plain building with a doorway — no production. -->
      <symbol id="icon-building" viewBox="0 0 24 24">
        <path d="M3 20h18"/>
        <path d="M5 20V5a1 1 0 011-1h9a1 1 0 011 1v15"/>
        <path d="M16 20V9h3a1 1 0 011 1v10"/>
        <path d="M8.5 8h1.5M8.5 12h1.5M12.5 8h1.5M12.5 12h1.5"/>
        <path d="M9.5 20v-4h3v4"/>
      </symbol>

      <!-- Added 2026-08-10 for the /leistungen/ redesign: one marker per service
           card. Seven symbols, because the sprite already covered the other four
           (#icon-shield-check Objektschutz, #icon-factory Werkschutz,
           #icon-contact Empfangsdienst, #icon-alert Interventionsdienst) and a
           near-miss glyph is worse than none — the reason this page shipped with
           no icons at all on 2026-08-09.
           Same 24x24 grid and the 1.5 stroke inherited from #icon-defs. Do NOT
           give any of them a fill: every symbol in this sprite is stroke-only
           except #icon-star, which declares its own paint. -->

      <!-- Revier- & Schließdienst: a key. The one service whose defining act is
           locking up, so the object beats any route/clock metaphor. -->
      <symbol id="icon-key" viewBox="0 0 24 24">
        <circle cx="7.5" cy="12" r="3.5"/>
        <path d="M11 12h9.5"/>
        <path d="M17.5 12v3M14.5 12v2.25"/>
      </symbol>
      <!-- Brandwache: a flame, outer contour plus the inner tongue so it still
           reads as fire at 26px rather than as a leaf. -->
      <symbol id="icon-flame" viewBox="0 0 24 24">
        <path d="M12 3c.4 3 2 4 3.4 5.6A7 7 0 0119 13.2 7 7 0 015 13.2c0-2.4 1.2-4 2.4-5.2.2 1.3.9 2 1.7 2 1 0 1.6-.8 1.6-2.1C10.7 6.2 11.1 4.4 12 3z"/>
        <path d="M12 20a3 3 0 01-3-3c0-1.6 1.4-2.4 2-3.6.7 1 3 2 3 3.7a3 3 0 01-2 2.9z"/>
      </symbol>
      <!-- Baustellenbewachung: a tower crane. The apex ties to both jib ends are
           what stop this reading as a gallows — the first draft had a bare T on a
           post and that is exactly what it looked like. -->
      <symbol id="icon-crane" viewBox="0 0 24 24">
        <path d="M3 21h18"/>
        <path d="M8 21V4.5"/>
        <path d="M3.5 4.5h17"/>
        <path d="M8 1.5l-4.5 3M8 1.5l12.5 3"/>
        <path d="M3.75 4.5v2.5h2.5V4.5"/>
        <path d="M16 4.5v3.5"/>
        <path d="M14.5 8h3v2.5h-3z"/>
      </symbol>
      <!-- Veranstaltungsschutz: a crowd behind a barrier. Three heads alone read
           as three dots at 26px; the rail is what makes it event control and not
           just "people". -->
      <symbol id="icon-crowd" viewBox="0 0 24 24">
        <circle cx="12" cy="5.75" r="2.25"/>
        <circle cx="5.5" cy="7.5" r="1.85"/>
        <circle cx="18.5" cy="7.5" r="1.85"/>
        <path d="M8.25 15c0-2.2 1.7-3.75 3.75-3.75S15.75 12.8 15.75 15"/>
        <path d="M2.5 15c0-1.9 1.3-3.1 3-3.25"/>
        <path d="M21.5 15c0-1.9-1.3-3.1-3-3.25"/>
        <path d="M2 17.5h20"/>
        <path d="M5.5 17.5V21M18.5 17.5V21"/>
      </symbol>
      <!-- Kaufhausdetektei: a retail bag. The store is the setting, and it is the
           only one of the eleven that happens inside one. -->
      <symbol id="icon-bag" viewBox="0 0 24 24">
        <path d="M5 7.5h14l-1.2 12.5H6.2L5 7.5z"/>
        <path d="M9 10V6.5a3 3 0 016 0V10"/>
      </symbol>
      <!-- Sicherheitstechnik: a bullet surveillance camera on a wall bracket, aimed
           down-left. Body, lens nub, arm, wall plate — nothing else.

           ⚠️ REDRAWN 2026-08-19 (client, on /sicherheitstechnik/: "wtf is this
           icon"). The previous version claimed a "lens ring" in this very comment
           and did not have one: it was a tilted parallelogram, two loose stubs, an
           L-shaped stand and a stray diagonal below the body with nothing to
           connect it to. At the 28px it actually renders at, that read as a broken
           glyph rather than as a camera.

           ⚠️ IT IS TWO CONSUMERS, BOTH AT 28px — `.service-points__icon` on
           /sicherheitstechnik/ and `.lh-card__icon` on /leistungen/ — so 28px is the
           size that decides it, not the large one. Six candidates were RENDERED at
           28 / 56 / 112 and compared as pixels, per this project's own rule for
           icons. What that killed: a dome-under-a-ceiling-rail (reads as a kitchen
           scale), a body on a floor stand (a projector), and — the useful one — an
           otherwise identical version carrying a proper round LENS, which at 28px
           collides with the body's own edge and turns into a smudge. The lens is a
           nub here for that measured reason; do not "improve" it into a circle
           without re-rendering at 28.

           The tilt is a group `rotate`, so the body stays a plain rect and the
           numbers stay readable. Rotating about (13.1, 12) rather than the grid
           centre is what balances the artwork inside the box — measured margins
           2,55 left / 2,65 right / 4,75 top and bottom, stroke included. -->
      <symbol id="icon-camera" viewBox="0 0 24 24">
        <g transform="rotate(-18 13.1 12)">
          <rect x="4.1" y="8" width="11.5" height="7.5" rx="2"/>
          <path d="M15.6 11.75h3"/>
        </g>
        <path d="M20.6 5.5v13"/>
        <path d="M16.9 13.4l3.7 2.2"/>
      </symbol>
      <!-- Added 2026-08-10 for /brandwache-nuernberg/'s Ablauf, step 02
           ("Abstimmen: Qualifikation und Einsatzplan klären wir direkt mit Behörde
           oder Versicherer"). A speech bubble with a check — a conversation that
           SETTLED something, which is what abstimmen means. Two elements.
           Chosen over a clipboard-with-check, which is the obvious alternative:
           a clipboard says "checklist", and this step is not a list, it is an
           agreement reached with a third party. It is also the only organic shape
           in this page's icon set, so it never blurs into the rectangles. -->
      <symbol id="icon-agree" viewBox="0 0 24 24">
        <path d="M20.6 11.9c0 4.1-3.9 7.5-8.6 7.5-.9 0-1.8-.13-2.6-.36L4.6 21l1.5-3.7a7 7 0 0 1-2.7-5.4c0-4.1 3.9-7.5 8.6-7.5s8.6 3.4 8.6 7.5z"/>
        <path d="M8.4 11.9l2.5 2.5 4.7-5"/>
      </symbol>
      <!-- Added 2026-08-10 for the same Ablauf, step 03 ("Wache steht:
           dokumentierte Runden, Meldekette, direkt erreichbarer Einsatzleiter").
           A guard inside the shield: the post is MANNED, which is the whole claim
           of that step.
           ⚠️ REPLACES an #icon-radio (a handheld two-way radio) drawn earlier the
           same day, and the reason it went is worth keeping: rendered at 44px it
           read as a card with lines on it, not as a radio. Four more radio drafts
           were rendered against it — narrower body, vertical speaker grille, a
           channel knob, a stand mic — and the best of them still needed a beat to
           decode. A glyph that needs a beat is the failure this whole icon pass
           exists to fix.
           ⚠️ The shield outline is #icon-shield-check's, COPIED EXACTLY rather
           than redrawn. Both appear on that page, two sections apart, so they have
           to read as one shield with two different things inside it — a person
           here, a check there — rather than as two similar shields. -->
      <symbol id="icon-guard" viewBox="0 0 24 24">
        <path d="M12 3l7 3v5c0 4.5-3 8.5-7 10-4-1.5-7-5.5-7-10V6l7-3z"/>
        <circle cx="12" cy="10" r="2.2"/>
        <path d="M8.4 16.3c.5-1.9 1.9-2.9 3.6-2.9s3.1 1 3.6 2.9"/>
      </symbol>
      <!-- Added 2026-08-10 for /sicherheitsdienst-nuernberg/'s "Digitales Wachbuch
           mit Checkpoint-Nachweis je Runde": a patrol route with a marker at each
           checkpoint.
           ⚠️ It REPLACES #icon-badge on that tile, and #icon-badge was not redrawn
           because it is not wrong — it is a medal, and two sections up it means
           "Kräfte mit § 34a GewO und Brandschutzhelfer-Qualifikation", which is
           exactly what a medal is for. It was only wrong on the Wachbuch tile.
           Also deliberately NOT #icon-document-check, which is the obvious paper
           metaphor: that symbol is already on this page, one section up, for
           "Dokumentation für Behörde und Versicherung". Two sheets-with-a-check on
           one page read as a repeat. A route with checkpoints is the only glyph in
           the set that carries "je RUNDE".
           The path starts and ends clear of the end markers (2.2 units from each
           centre against a 1.8 radius) so the line never runs through a dot. -->
      <symbol id="icon-route" viewBox="0 0 24 24">
        <path d="M8.4 5.4h6.2a3.4 3.4 0 0 1 0 6.8H9.4a3.4 3.4 0 0 0 0 6.8h6.2"/>
        <circle cx="6.2" cy="5.4" r="1.8"/>
        <circle cx="12" cy="12.2" r="1.8"/>
        <circle cx="17.8" cy="19" r="1.8"/>
      </symbol>
      <!-- Sicherheitskonzept: the plan sheet itself, with the measure ticks that
           make it a drawing rather than a letter, and the approved check. -->
      <symbol id="icon-plan" viewBox="0 0 24 24">
        <rect x="3.5" y="3.5" width="17" height="17" rx="2"/>
        <path d="M3.5 8h17"/>
        <path d="M8 8v12.5"/>
        <path d="M11 12.5l2 2 4.5-4.5"/>
        <path d="M5.75 11.5h2.5M5.75 15h2.5"/>
      </symbol>
    </g>
  </defs>
</svg>
