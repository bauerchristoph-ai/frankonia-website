<!-- The FRANKONIA Sicherheitskonzept document mockup, used twice on
     /sicherheitskonzept/: as the hero visual (client 2026-08-13, Q3) and as the
     clickable preview on the sample-download card in section 6b (Q4).

     A PARTIAL, not two copies of 40 lines of SVG. It is the same document in both
     places, so it has to stay the same drawing — and the build resolves the
     "include: sk-doc" marker at compile time, so the browser still receives plain
     inline SVG with no runtime cost.

     ⚠️ NEVER SPELL AN INCLUDE MARKER OUT IN FULL INSIDE A COMMENT. An HTML comment
     ends at the first close-comment sequence, so writing the marker with its
     delimiters closed this comment early and dumped the rest of it onto the page
     as visible body text, right beside the document card. Caught in a screenshot;
     the build has no reason to complain. Refer to the marker by name, as above.
     (The same trap bites twice: the sentence explaining it must not contain the
     sequence either.)

     INLINE SVG, not an image and not a screenshot of the real PDF:
     · crisp at every size and DPR, and a picture of a document page is the one
       thing that must never look soft;
     · no request on the critical path — like /einsatzgebiete/'s map hero, this
       page has no LCP image at all;
     · its colours come from CSS custom properties and section context, so the
       one drawing works on the dark hero AND on the white sample section.

     The CONTENT is the real document's, not invented: the title block, the
     "ANONYMISIERTE MUSTERVERSION" chip, "Muster GmbH · Werksgelände", the numbered
     chapter rows and "Seite 1 von 18" all match the PDF that ships at
     /assets/documents/frankonia-sicherheitskonzept-muster.pdf.

     ⚠️ NO TRAFFIC-LIGHT COLOURS. The real page 7 grades its 16 risks Grün / Gelb /
     Rot (5 / 7 / 4), and reproducing that literally would put three new hues into
     a site with a strict five-colour palette, for a decorative graphic. The matrix
     is drawn in four tints of the brand blue instead — it still reads as a graded
     analysis grid and invents no colour system.

     aria-hidden at both call sites: it is decoration. Every fact it depicts is
     real text elsewhere on the page. -->
