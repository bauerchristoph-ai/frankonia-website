<!-- No font preload here — typography is now a system stack (Helvetica
     Neue / Arial, see tokens.css --font-family-base), nothing to
     self-host or preload. These two lines used to preload Open Sans;
     removing them also fixes a pre-existing bug worth knowing about:
     they pointed at open-sans-regular-400.woff2/open-sans-extrabold-800.woff2,
     two static files that never actually existed in assets/fonts/ (only
     the single open-sans-variable.woff2 file was ever added, 2026-07-15)
     — every page load was silently issuing two failed preload requests
     for files that 404'd. -->
<!-- The 7 site-wide stylesheets (tokens, reset, base, layout, components,
     site-chrome, motion) are bundled + minified into /css/app.css by
     build.js (buildCss). Keep SHARED_CSS_ORDER there in sync with this. -->
<link rel="stylesheet" href="/css/app.css">
<script src="/js/main.js" defer></script>
<!-- Pauses looping CSS animations in sections that are off screen (perf,
     2026-08-19). Site-wide because the CTA gloss (btn-shine) loops on every
     page; the big win is the homepage's Konzept diagram. Nothing visible
     changes — see js/pause-offscreen.js and the .is-anim-paused rule in
     motion.css for why, and for the rootMargin that keeps it that way. -->
<script src="/js/pause-offscreen.js" defer></script>
