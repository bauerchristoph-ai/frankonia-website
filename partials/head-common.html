<!-- ==========================================================================
     CONSENT UND TAG MANAGER — 2026-08-26
     ==========================================================================
     ⚠️⚠️ DIE REIHENFOLGE DIESER DREI BLÖCKE IST NICHT VERHANDELBAR:
       1. Cookiebot (CMP)
       2. Google Consent Mode v2, Standardzustand "denied"
       3. Google Tag Manager
     Lädt der Tag Manager vor der CMP, feuern Tags VOR der Einwilligung. Das ist
     der häufigste Fehler bei dieser Kombination und rechtlich der teuerste.

     ⚠️ SIE STEHEN GANZ OBEN IN DIESEM PARTIAL, und das ist der Grund: dieses
     Partial wird auf allen 69 Seiten im <head> eingebunden, und geprüft ist,
     dass KEINE Seite davor ein ausfuehrbares Script-Tag hat (die Zeilen davor
     sind meta,
     canonical, Open Graph und JSON-LD — kein ausführbares Script). Damit sind
     diese drei die ersten Skripte jeder Seite. Nichts oberhalb einfügen.

     ⚠️ DIE CSP MUSSTE DAFÜR GEÖFFNET WERDEN, inklusive 'unsafe-inline' in
     script-src — vorher stand hier `script-src 'self'`. Warum das mit GTM
     unvermeidbar ist und was es kostet, steht vollständig in
     docs/design-sources/csp-build.js. Wer hier einen Drittanbieter ergänzt,
     muss dort seinen Host eintragen und das Skript neu laufen lassen: ein
     blockiertes Script erzeugt KEINEN sichtbaren Fehler.
     ========================================================================== -->

<!-- 1 — Cookiebot. data-blockingmode="auto" blockiert erkannte
     Drittanbieter-Skripte selbständig bis zur Einwilligung; deshalb ist hier
     nichts von Hand auf type="text/plain" umgestellt.
     ⚠️ Die eine Ausnahme davon ist Turnstile: der Spamschutz darf NICHT auf
     eine Einwilligung warten, sonst schützt er die Besucher nicht, die den
     Banner ignorieren. Das Opt-out steckt in js/lead-form.js
     (data-cookieconsent="ignore"), weil das Script von dort geladen wird.
     ⚠️ Die CBID ist öffentlich und steht ohnehin im ausgelieferten HTML. Sie
     kommt trotzdem aus COOKIEBOT_CBID, damit eine Testumgebung eine eigene
     Domain-Gruppe einsetzen kann — siehe PUBLIC_ENV in build.js. -->
<script id="Cookiebot"
        src="https://consent.cookiebot.com/uc.js"
        data-cbid="{{env.cookiebotCbid}}"
        data-blockingmode="auto"
        type="text/javascript"></script>

<!-- 2 — Google Consent Mode v2, alles auf "denied", bevor irgendein Tag lädt.
     security_storage bleibt "granted": das ist die Kategorie für
     Sicherheitszwecke (Betrugserkennung) und nicht einwilligungspflichtig.
     wait_for_update gibt der CMP 500 ms, ihren gespeicherten Zustand zu
     melden, bevor Tags mit dem Standard weiterarbeiten — ohne das entstehen
     bei wiederkehrenden Besuchern verlorene Messungen, obwohl die
     Einwilligung längst vorliegt.
     ads_data_redaction schneidet Werbe-Identifikatoren ab, solange
     ad_storage verweigert ist; url_passthrough hängt die nötigen Parameter
     an interne Links, damit eine Google-Ads-Zuordnung ohne Cookies nicht
     komplett verloren geht.
     ⚠️ DIESER BLOCK GRANTED NICHTS. Das Hochsetzen macht Cookiebot, und zwar
     nur, wenn im Cookiebot-Konto die Consent-Mode-Integration aktiviert ist.
     Ist sie aus, bleibt alles dauerhaft "denied" und keine Messung läuft je —
     ohne Fehlermeldung. Das ist der eine Punkt hier, der stillschweigend
     fehlschlägt; er steht deshalb im Bericht. -->
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag() { dataLayer.push(arguments); }
  gtag("consent", "default", {
    ad_storage: "denied",
    ad_user_data: "denied",
    ad_personalization: "denied",
    analytics_storage: "denied",
    functionality_storage: "denied",
    personalization_storage: "denied",
    security_storage: "granted",
    wait_for_update: 500
  });
  gtag("set", "ads_data_redaction", true);
  gtag("set", "url_passthrough", true);
</script>

<!-- 3 — Google Tag Manager, Container GTM-NWLGMFJN.
     ⚠️ DAS IST NICHT DAS STANDARD-SNIPPET VON GOOGLE. Der Container lädt über
     den eigenen Tagging-Server d.frankonia-sicherheit.de (stape), damit
     Adblocker und Browser-Tracking-Schutz seltener greifen. Der kodierte Wert
     hinter 28l= ist die stape-Konfiguration: nichts umformatieren, nichts
     kürzen, keinen Parameter anfassen.
     ⚠️ ABHÄNGIGKEIT: antwortet d.frankonia-sicherheit.de nicht, lädt GTM
     sitewide gar nicht — und zwar ohne sichtbaren Fehler. Nach jedem Deploy im
     Netzwerk-Tab prüfen, dass der Loader mit HTTP 200 kommt.
     Die Container-ID steckt bereits im Snippet, deshalb liest dieser Loader
     GTM_CONTAINER_ID nicht aus; die Variable steht in .env.example nur als
     Dokumentation. -->
<!-- Google Tag Manager -->
<script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],j=d.createElement(s);j.async=true;j.src="https://d.frankonia-sicherheit.de/7ll8fjctyrvc.js?"+i;f.parentNode.insertBefore(j,f);})(window,document,'script','dataLayer','28l=ChJPPiAuRyg0OjU0MikkQBVLQFdFRQ4IXhAAGBoIBQgKF18KHQACAxEeFxAATQ4D');</script>
<!-- End Google Tag Manager -->

<!-- No font preload here — typography is now a system stack (Helvetica
     Neue / Arial, see tokens.css --font-family-base), nothing to
     self-host or preload. These two lines used to preload Open Sans;
     removing them also fixes a pre-existing bug worth knowing about:
     they pointed at open-sans-regular-400.woff2/open-sans-extrabold-800.woff2,
     two static files that never actually existed in assets/fonts/ (only
     the single open-sans-variable.woff2 file was ever added, 2026-07-15)
     — every page load was silently issuing two failed preload requests
     for files that 404'd. -->
<!-- The 7 site-wide stylesheets (tokens, reset, base, layout, components,
     site-chrome, motion) are bundled + minified into /css/app.css by
     build.js (buildCss). Keep SHARED_CSS_ORDER there in sync with this. -->
<link rel="stylesheet" href="/css/app.css">
<script src="/js/main.js" defer></script>
<!-- Pauses looping CSS animations in sections that are off screen (perf,
     2026-08-19). Site-wide because the CTA gloss (btn-shine) loops on every
     page; the big win is the homepage's Konzept diagram. Nothing visible
     changes — see js/pause-offscreen.js and the .is-anim-paused rule in
     motion.css for why, and for the rootMargin that keeps it that way. -->
<script src="/js/pause-offscreen.js" defer></script>

<!-- SOCIAL-SHARE IMAGE, on every page (2026-08-21).
     Before this, all 54 pages sent twitter:card="summary_large_image" and only
     the homepage declared an og:image at all — pointing at
     /assets/images/og-home.jpg, a file that was never created. So every link
     shared into WhatsApp, LinkedIn or Slack asked for a large-image card and
     supplied nothing, and rendered as a bare text row. On a B2B site whose
     whole job is a decision-maker forwarding a service page to a colleague,
     that is a live conversion surface rendering broken.

     {{ogimage}} defaults to the homepage hero (content/values.json) and is
     overridden per page by passing an `ogimage` parameter on this partial's own
     include marker — see any of the 15 pages that have their own hero photo for
     the exact form. That is the client's rule: each page shows its own hero, a
     page without a hero photograph shows the homepage's.

     ⚠️ THE LINE ABOVE USED TO SPELL THAT MARKER OUT IN FULL, and it broke every
     page on the site for two days. An HTML comment cannot contain the marker's
     closing delimiter: it ends the comment early, and everything after it — the
     rest of this note — was dumped as visible text at the top of all 61 pages.
     It survived because the checks that followed read the meta tags
     programmatically and never looked at the top of a rendered page.
     Refer to the marker by name here. Never write it with its delimiters.

     The origin is written out because og:image must be an ABSOLUTE URL —
     relative paths are not resolved reliably by scrapers. One occurrence here
     replaces what would otherwise be 54, and every page already hardcodes the
     same origin in its canonical tag.

     og:image:alt is per page too ({{ogimagealt}}, client 2026-08-21). It is a
     DESCRIPTION of the share image, written from the rendered crop rather than
     from the page's topic - the 39 pages on the fallback all show the homepage
     hero, so the default describes that photograph and is correct for them.

     Width/height let a scraper lay the card out before it has fetched the file. -->
<meta property="og:image" content="https://frankonia-sicherheit.de{{ogimage}}">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:image" content="https://frankonia-sicherheit.de{{ogimage}}">
<meta property="og:image:alt" content="{{ogimagealt}}">
